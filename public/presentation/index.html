<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Auto redirect dalam 1 saat -->
    <meta http-equiv="refresh" content="1; url=https://sifoo8ai.github.io/logkerja/public/">
    <title>Mengalihkan ke Persembahan LogKerja...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            max-width: 480px;
            width: 100%;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { font-size: 1.4rem; margin-bottom: 10px; color: #f1f5f9; font-weight: 600; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 24px; }
        a.btn {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s ease;
        }
        a.btn:hover { background-color: #0369a1; }
    </style>
    <script>
        // Backup JS redirect
        setTimeout(function() {
            window.location.href = "https://sifoo8ai.github.io/logkerja/public/";
        }, 500);
    </script>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>Sedang Mengalihkan...</h1>
        <p>Lokasi persembahan penilaian telah dipindahkan. Anda akan dibawa ke lokasi rasmi baru secara automatik.</p>
        <a href="https://sifoo8ai.github.io/logkerja/public/" class="btn">Klik Sini Jika Tidak Dialihkan</a>
    </div>
</body>
</html>
