<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>LogKerja</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        .refresh-btn {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #2563eb;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .refresh-btn:active {
            background: #bfdbfe;
        }

        .frame-container {
            height: calc(100% - 38px);
            /* calc header height */
        }
    </style>
</head>

<body>
    <div class="header">
        <div style="display: flex; align-items: center; gap: 8px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <line x1="10" y1="9" x2="8" y2="9"></line>
            </svg>
            <span>LogKerja Panel</span>
        </div>
        <button id="refreshBtn" class="refresh-btn">Segar Semula</button>
    </div>
    <div class="frame-container">
        <!-- Uses localhost by default for dev. Adjust accordingly for prod -->
        <iframe id="appFrame" src="http://localhost:5173"
            allow="clipboard-read; clipboard-write; notifications"></iframe>
    </div>
    <script src="sidepanel.js"></script>
</body>

</html>
