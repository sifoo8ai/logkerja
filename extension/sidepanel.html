<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>LogKerja</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8f9fc;
            /* Match background React app kau */
        }

        /* Iframe sekarang ambil 100% height, tiada lagi border/header kacau */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Idea Kayangan Mek Na: Butang Refresh Terapung (Floating Button) */
        .floating-refresh {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            /* Efek glassmorphism */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            /* Pastikan dia sentiasa di atas iframe */
            color: #64748b;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Hover effect: Tukar warna biru & pusing sikit */
        .floating-refresh:hover {
            color: #2563eb;
            background: rgba(255, 255, 255, 0.95);
            transform: rotate(45deg) scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.15);
            border-color: #bfdbfe;
        }

        /* Active effect: Masa tengah klik */
        .floating-refresh:active {
            transform: rotate(180deg) scale(0.9);
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.1);
        }

        .refresh-icon {
            width: 18px;
            height: 18px;
        }
    </style>
</head>

<body>
    <!-- Butang Refresh Terapung -->
    <button id="refreshBtn" class="floating-refresh" title="Segar Semula">
        <svg class="refresh-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
        </svg>
    </button>

    <!-- Iframe App -->
    <!-- Uses localhost by default for dev. Adjust accordingly for prod -->
    <iframe id="appFrame" src="https://logkerja.vercel.app/app" allow="clipboard-read; clipboard-write"></iframe>

    <script src="sidepanel.js"></script>
</body>

</html>
